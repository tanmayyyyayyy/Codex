<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARDEN // ROI Calculator</title>
    <style>
        :root {
            --bg-void: #0a0a0c;
            --bg-card: #121217;
            --accent-violet: #8a2be2;
            --accent-glow: rgba(138, 43, 226, 0.3);
            --text-primary: #f0f0f5;
            --text-muted: #9494b8;
            --text-accent: #c792ea;
            --border-color: #242432;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-void);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
            z-index: -1;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--d) infinite ease-in-out;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .roi-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 20px var(--accent-glow);
            position: relative;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: var(--text-accent);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, var(--accent-violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 30px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .value-badge {
            background: var(--border-color);
            color: var(--text-accent);
            padding: 4px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 600;
            font-size: 1rem;
            border: 1px solid var(--accent-violet);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--accent-violet);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-violet);
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .results {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .result-card {
            text-align: center;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .result-card:hover {
            border-color: var(--accent-violet);
            background: rgba(138, 43, 226, 0.05);
        }

        .result-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            display: block;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            font-family: monospace;
        }

        .total-card {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.2), rgba(75, 0, 130, 0.1));
            border: 1px solid var(--accent-violet);
        }

        .total-card .result-value {
            font-size: 2.5rem;
            color: var(--text-accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }
    </style>
</head>
<body>
    <div class="stars" id="star-field"></div>

    <div class="roi-container">
        <div class="header">
            <span class="brand">Security Sentinel</span>
            <h1>ROI Calculator</h1>
        </div>

        <div class="input-group">
            <div class="label-row">
                <label>Governed Agents</label>
                <span class="value-badge" id="val-agents">10</span>
            </div>
            <input type="range" id="in-agents" min="1" max="100" value="10">
        </div>

        <div class="input-group">
            <div class="label-row">
                <label>Hours Saved / Agent / Month</label>
                <span class="value-badge" id="val-hours">5</span>
            </div>
            <input type="range" id="in-hours" min="1" max="40" value="5">
        </div>

        <div class="input-group">
            <div class="label-row">
                <label>Staff Cost / Hour ($)</label>
                <span class="value-badge" id="val-cost">80</span>
            </div>
            <input type="range" id="in-cost" min="20" max="250" step="5" value="80">
        </div>

        <div class="results">
            <div class="result-card">
                <span class="result-label">Monthly Hours</span>
                <div class="result-value" id="res-monthly-hours">50</div>
            </div>
            <div class="result-card">
                <span class="result-label">Monthly $</span>
                <div class="result-value" id="res-monthly-cash">$4,000</div>
            </div>
            <div class="result-card total-card">
                <span class="result-label">Projected Annual Savings</span>
                <div class="result-value" id="res-annual-cash">$48,000</div>
            </div>
        </div>
    </div>

    <script src="roi-calculator.js"></script>
</body>
</html>
